name: Desplegar sitio

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC hacia AWS, sin claves guardadas
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Subir HTML (sin caché larga)
        run: |
          aws s3 sync site/ "s3://${{ secrets.SITE_BUCKET }}" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Subir el resto (caché de una semana)
        run: |
          aws s3 sync site/ "s3://${{ secrets.SITE_BUCKET }}" --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=604800"

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" --query 'Invalidation.Status' --output text
