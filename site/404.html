<!doctype html>
<html lang="es" data-title-es="Fuera de control · Pablo Duque Marín" data-title-en="Out of control · Pablo Duque Marín">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuera de control · Pablo Duque Marín</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="dark light">
<script src="/theme.js"></script>
<!-- idioma: el mismo que la portada (localStorage 'pd-lang' o el del navegador); sin JavaScript queda en español -->
<script src="/lab/lab.js"></script>
<style>
:root{--bg:#0b0d11;--ink:#eceef1;--ink2:#cbd1d7;--lime:#c3e65f;--lime-ink:#c3e65f;--on-lime:#0b0d11;color-scheme:dark}
html[data-theme="light"]{--bg:#f6f7f3;--ink:#14171c;--ink2:#3a414a;--lime:#c3e65f;--lime-ink:#3f6212;--on-lime:#0b0d11;color-scheme:light}
html:not([data-lang="en"]) [data-l="en"],html[data-lang="en"] [data-l="es"]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px;box-sizing:border-box}
main{max-width:560px}
p.k{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--lime-ink);margin:0 0 12px}
h1{font-size:clamp(36px,7vw,64px);line-height:1;letter-spacing:-.04em;margin:0 0 16px}
p{color:var(--ink2);font-size:17px;line-height:1.6;margin:0 0 28px}
a{display:inline-block;padding:14px 20px;border-radius:8px;background:var(--lime);color:var(--on-lime);font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid var(--lime-ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="k"><span data-l="es">404 · punto fuera de límite</span><span data-l="en">404 · out-of-limit point</span></p>
  <h1><span data-l="es">Esta página se salió de control.</span><span data-l="en">This page went out of control.</span></h1>
  <p><span data-l="es">No existe o cambió de dirección.</span><span data-l="en">It does not exist or has moved.</span></p>
  <a href="/"><span data-l="es">Volver al inicio</span><span data-l="en">Back home</span></a>
</main>
</body>
</html>
